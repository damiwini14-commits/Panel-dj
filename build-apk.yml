name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: mkdir -p www && cp index.html www/index.html
      - run: npm init -y && npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - run: npx cap init "Panel DJ" com.paneldj.app --web-dir www
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: panel-dj-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
