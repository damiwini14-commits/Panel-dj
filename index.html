<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel DJ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#1a0f2e;--pn:#2b1a4d;--pn2:#3a2468;--ink:#f6efff;--mut:#a899c8;--a:#ff3d81;--b:#3de8ff;--c:#ffb938;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.3 "Chakra Petch",system-ui,sans-serif;padding:10px}
.app{display:grid;gap:10px;max-width:1000px;margin:auto}
@media(min-width:640px){.app{grid-template-columns:1fr 1fr}.cross,.pads{grid-column:1/-1}}
.deck{--k:var(--a);background:var(--pn);border-radius:18px;padding:12px;border:2px solid var(--k);box-shadow:0 0 24px color-mix(in srgb,var(--k) 35%,transparent)}
.deck.b{--k:var(--b)}
.deck header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.deck header b{background:var(--k);color:#1a0f2e;border-radius:8px;padding:2px 10px;font-size:18px}
.nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
button,.ld{font:inherit;color:var(--ink);background:var(--pn2);border:0;border-radius:12px;padding:12px 10px;min-height:44px;cursor:pointer;touch-action:manipulation}
.ld{padding:8px 12px;min-height:0;background:var(--k);color:#1a0f2e;font-weight:700}
button:active{transform:scale(.96)}
button.on{background:var(--k);color:#1a0f2e;font-weight:700}
button:focus-visible,input:focus-visible,.ld:focus-within{outline:2px solid var(--c);outline-offset:2px}
.pl{display:flex;justify-content:center;margin:6px 0}
.wheel{width:min(62vw,230px);aspect-ratio:1;border-radius:50%;position:relative;touch-action:none;cursor:grab;
background:radial-gradient(circle,var(--k) 0 22%,#120a22 23% 25%,transparent 26%),repeating-radial-gradient(circle,#0e0818 0 3px,#1d1233 3px 6px);border:4px solid var(--pn2)}
.wheel i{position:absolute;left:50%;top:4%;width:6px;height:22%;margin-left:-3px;border-radius:3px;background:var(--c)}
.bar{height:14px;background:#120a22;border-radius:7px;overflow:hidden;cursor:pointer;touch-action:none}
.bar u{display:block;height:100%;width:0;background:var(--k)}
.tm{display:block;text-align:right;color:var(--mut);margin:2px 2px 8px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.mix{display:grid;grid-template-columns:1fr 52px 52px;gap:10px;align-items:stretch}
.eq{display:grid;gap:6px;align-content:space-between}
label.s{display:grid;gap:2px;color:var(--mut);font-size:12px}
input[type=range]{width:100%;accent-color:var(--k);height:28px;margin:0}
.v{display:grid;justify-items:center;gap:4px;color:var(--mut);font-size:12px}
.v input{writing-mode:vertical-lr;direction:rtl;width:28px;height:130px}
.fx{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.cross,.pads{background:var(--pn);border-radius:18px;padding:12px}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pads button{background:var(--c);color:#1a0f2e;font-weight:700;min-height:56px}
.cross input{accent-color:var(--c);height:36px}
.cross div{display:flex;justify-content:space-between;color:var(--mut)}
.hint{text-align:center;color:var(--mut);font-size:12px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.tools{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools button{background:var(--c);color:#1a0f2e;font-weight:700}
.url{display:flex;gap:6px;margin-bottom:6px}
.url input{flex:1;min-width:0;height:36px;border-radius:10px;border:0;padding:0 10px;background:#120a22;color:var(--ink);font:inherit;font-size:12px}
.url button{min-height:36px;padding:0 12px}
.ld{position:relative;overflow:hidden;display:inline-block}
.ld input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.fi{width:100%;margin-bottom:6px;font:inherit;font-size:12px;color:var(--mut)}
.fi::file-selector-button{background:var(--k);color:#1a0f2e;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;margin-right:8px;cursor:pointer}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(88vw,360px);background:var(--pn);border-left:2px solid var(--c);padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(105%);visibility:hidden;transition:transform .25s,visibility 0s .25s;overflow-y:auto;z-index:20;box-shadow:-10px 0 30px #0008}
.dr.open{transform:none;visibility:visible;transition:transform .25s}
.dr h2{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pg button{background:var(--c);color:#1a0f2e;font-weight:700;min-height:64px;padding:4px;font-size:12px}
.pg button:nth-child(4n+2){background:var(--a)}.pg button:nth-child(4n+3){background:var(--b)}.pg button:nth-child(4n){background:#b48cff}
@media(prefers-reduced-motion:reduce){.dr{transition:none}}
</style></head>
<body>
<canvas id="bg"></canvas>
<div class="app" id="app"></div>
<p class="hint">Carga canciones de tu celular o pega un enlace directo a un audio. Gira la rueda para rayar.</p>
<script>
const AC=new (window.AudioContext||window.webkitAudioContext)();
const master=AC.createGain(),comp=AC.createDynamicsCompressor();
master.connect(comp);comp.connect(AC.destination);
const an=AC.createAnalyser();an.fftSize=256;comp.connect(an);
const $=(r,s)=>r.querySelector(s),all=(r,s)=>[...r.querySelectorAll(s)];
const bq=(t,f,g=0)=>{const n=AC.createBiquadFilter();n.type=t;n.frequency.value=f;n.gain.value=g;return n};
const gn=v=>{const n=AC.createGain();n.gain.value=v;return n};
function ir(){const n=AC.sampleRate*2,b=AC.createBuffer(2,n,AC.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)}return b}
const IR=ir();
const T=(p,v)=>p.setTargetAtTime(v,AC.currentTime,.02);
const fmt=s=>isFinite(s)?Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0"):"0:00";

const tpl=(L,c)=>`<section class="deck ${c}"><header><b>${L}</b><span class="nm">Sin canción</span></header>
<input class="fi" type="file" accept="audio/*" aria-label="Cargar canción">
<div class="url"><input type="url" placeholder="Pega un enlace directo a un .mp3" aria-label="Enlace de audio"><button>Ir</button></div>
<div class="pl"><div class="wheel"><i></i></div></div>
<div class="bar"><u></u></div><small class="tm">0:00</small>
<div class="row"><button class="cue">Cue</button><button class="play">Play</button><button class="brk">Freno</button></div>
<div class="mix"><div class="eq">
<label class="s">Graves<input class="lo" type="range" min="-18" max="12" value="0"></label>
<label class="s">Medios<input class="mi" type="range" min="-18" max="12" value="0"></label>
<label class="s">Agudos<input class="hi" type="range" min="-18" max="12" value="0"></label>
<label class="s">Filtro<input class="fl" type="range" min="-100" max="100" value="0"></label></div>
<div class="v">Tono<input class="pt" type="range" min="-12" max="12" step=".1" value="0"></div>
<div class="v">Vol<input class="vl" type="range" min="0" max="100" value="80"></div></div>
<div class="fx"><button data-f="eco">Eco</button><button data-f="rev">Reverb</button><button data-f="fla">Flanger</button><button data-f="gate">Trance</button></div></section>`;

const app=document.getElementById("app");
app.innerHTML=`<section class="tools"><button id="openFx">Efectos</button><button id="bgBtn">Fondo</button></section>`+tpl("A","a")+tpl("B","b")+
`<section class="cross"><div><span>A</span><span>Crossfader</span><span>B</span></div><input id="cf" type="range" min="0" max="100" value="50" style="width:100%"></section>
`;

function deck(root){
 const el=new Audio();el.preservesPitch=el.mozPreservesPitch=el.webkitPreservesPitch=false;
 const src=AC.createMediaElementSource(el);
 const lo=bq("lowshelf",200),mi=bq("peaking",1000),hi=bq("highshelf",3500),fl=bq("lowpass",22000);
 mi.Q.value=1;
 src.connect(lo);lo.connect(mi);mi.connect(hi);hi.connect(fl);
 const bus=gn(1),gate=gn(1),vol=gn(.8),cross=gn(.7);
 fl.connect(bus);
 const d=AC.createDelay(2);d.delayTime.value=.375;const fb=gn(.45),wD=gn(0);fl.connect(d);d.connect(wD);wD.connect(bus);d.connect(fb);fb.connect(d);
 const cv=AC.createConvolver();cv.buffer=IR;const wR=gn(0);fl.connect(cv);cv.connect(wR);wR.connect(bus);
 const fd=AC.createDelay(.1);fd.delayTime.value=.005;const lf=AC.createOscillator();lf.frequency.value=.3;const ld=gn(.003);lf.connect(ld);ld.connect(fd.delayTime);lf.start();
 const ff=gn(.5),wF=gn(0);fl.connect(fd);fd.connect(wF);wF.connect(bus);fd.connect(ff);ff.connect(fd);
 const gl=AC.createOscillator();gl.type="square";gl.frequency.value=6;const gd=gn(0);gl.connect(gd);gd.connect(gate.gain);gl.start();
 bus.connect(gate);gate.connect(vol);vol.connect(cross);cross.connect(master);
 const fxs={eco:on=>T(wD.gain,on?.6:0),rev:on=>T(wR.gain,on?.9:0),fla:on=>T(wF.gain,on?.8:0),gate:on=>{gate.gain.value=on?.5:1;gd.gain.value=on?.5:0}};
 const rate=()=>{el.playbackRate=1+$(root,".pt").value/100};
 let cue=0,br=null,was=false;
 $(root,'input[type=file]').onchange=e=>{const f=e.target.files[0];if(!f)return;el.loop=false;el.src=URL.createObjectURL(f);$(root,".nm").textContent=f.name;cue=0;rate()};
 $(root,".play").onclick=()=>{AC.resume();if(!el.src)return;el.paused?el.play():el.pause()};
 $(root,".cue").onclick=()=>{if(!el.src)return;if(el.paused)cue=el.currentTime;else{el.pause();el.currentTime=cue}};
 const stopBr=()=>{if(br){clearInterval(br);br=null;if(was){rate();el.play()}was=false}};
 const brk=$(root,".brk");
 brk.onpointerdown=()=>{if(el.paused)return;was=true;let r=el.playbackRate;br=setInterval(()=>{r*=.9;if(r<.07){el.pause();clearInterval(br)}else el.playbackRate=r},40)};
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>brk.addEventListener(ev,stopBr));
 all(root,".fx button").forEach(b=>b.onclick=()=>{AC.resume();b.classList.toggle("on");fxs[b.dataset.f](b.classList.contains("on"))});
 $(root,".lo").oninput=e=>lo.gain.value=+e.target.value;
 $(root,".mi").oninput=e=>mi.gain.value=+e.target.value;
 $(root,".hi").oninput=e=>hi.gain.value=+e.target.value;
 $(root,".pt").oninput=rate;
 $(root,".vl").oninput=e=>vol.gain.value=e.target.value/100*1.1;
 $(root,".fl").oninput=e=>{const v=e.target.value/100;if(v<0){fl.type="lowpass";fl.frequency.value=20000*Math.pow(.01,-v)}else if(v>0){fl.type="highpass";fl.frequency.value=20*Math.pow(150,v)}else{fl.type="lowpass";fl.frequency.value=22000}};
 const w=$(root,".wheel");let ang=null;
 const a=e=>{const r=w.getBoundingClientRect();return Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2)};
 w.onpointerdown=e=>{AC.resume();w.setPointerCapture(e.pointerId);ang=a(e)};
 w.onpointermove=e=>{if(ang===null||!el.src)return;let n=a(e),x=n-ang;if(x>Math.PI)x-=2*Math.PI;if(x<-Math.PI)x+=2*Math.PI;ang=n;el.currentTime=Math.max(0,el.currentTime+x/(2*Math.PI)*1.8)};
 w.onpointerup=w.onpointercancel=()=>ang=null;
 $(root,".bar").onpointerdown=e=>{if(!el.duration)return;const r=e.currentTarget.getBoundingClientRect();el.currentTime=(e.clientX-r.left)/r.width*el.duration};
 $(root,".url button").onclick=()=>{AC.resume();const u=$(root,".url input").value.trim();if(!u)return;el.loop=false;el.crossOrigin="anonymous";el.src=u;$(root,".nm").textContent=decodeURIComponent(u.split("?")[0].split("/").pop()||u);cue=0;rate();el.play().catch(()=>{})};
 el.onerror=()=>{if(el.src)$(root,".nm").textContent="No se pudo cargar. Ese enlace no permite mezclar."};
 return{cross,tick(){const t=el.currentTime;w.style.transform=`rotate(${t*200}deg)`;$(root,".bar u").style.width=(el.duration?t/el.duration*100:0)+"%";$(root,".tm").textContent=fmt(t)+" / "+fmt(el.duration);const p=$(root,".play");p.textContent=el.paused?"Play":"Pausa";p.classList.toggle("on",!el.paused)}}
}
const D=all(document,".deck").map(deck);
const cf=document.getElementById("cf");
const setCf=()=>{const x=cf.value/100;D[0].cross.gain.value=Math.cos(x*Math.PI/2);D[1].cross.gain.value=Math.sin(x*Math.PI/2)};
cf.oninput=setCf;setCf();
const cv2=document.getElementById("bg"),cx=cv2.getContext("2d"),fq=new Uint8Array(128);
let bgm=matchMedia("(prefers-reduced-motion:reduce)").matches?3:0,hue=0;
const size=()=>{cv2.width=innerWidth;cv2.height=innerHeight};size();addEventListener("resize",size);
function drawBg(){const W=cv2.width,H=cv2.height;cx.clearRect(0,0,W,H);if(bgm==3)return;an.getByteFrequencyData(fq);hue=(hue+.5)%360;
 const bass=(fq[0]+fq[1]+fq[2])/765;
 if(bgm==0){const n=48,w=W/n;cx.globalAlpha=.55;for(let i=0;i<n;i++){const v=fq[i]/255;cx.fillStyle=`hsl(${hue+i*4},90%,55%)`;cx.fillRect(i*w,H-v*H*.9,w-2,v*H*.9)}}
 if(bgm==1){cx.globalAlpha=.5;cx.lineWidth=6;for(let k=0;k<4;k++){cx.strokeStyle=`hsl(${hue+k*60},95%,60%)`;cx.beginPath();cx.arc(W/2,H/2,(k+1)*Math.min(W,H)*.1*(1+bass*1.5),0,7);cx.stroke()}}
 if(bgm==2){cx.globalAlpha=Math.min(.35,bass*.5);cx.fillStyle=`hsl(${hue},90%,50%)`;cx.fillRect(0,0,W,H)}
 cx.globalAlpha=1}
(function loop(){D.forEach(d=>d.tick());drawBg();requestAnimationFrame(loop)})();

function pad(n){AC.resume();const t=AC.currentTime,g=gn(.0001);g.connect(master);
 if(n==3){const b=AC.createBuffer(1,AC.sampleRate*.3,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/c.length,4);const s=AC.createBufferSource();s.buffer=b;const f=bq("bandpass",1500);s.connect(f);f.connect(g);g.gain.setValueAtTime(1,t);s.start(t);return}
 const o=AC.createOscillator();o.connect(g);
 if(n==0){o.type="sawtooth";o.frequency.setValueAtTime(500,t);o.frequency.linearRampToValueAtTime(1200,t+.35);o.frequency.linearRampToValueAtTime(500,t+.7);g.gain.setValueAtTime(.4,t);g.gain.linearRampToValueAtTime(0,t+.7);o.stop(t+.7)}
 if(n==1){o.type="square";o.frequency.setValueAtTime(2000,t);o.frequency.exponentialRampToValueAtTime(80,t+.25);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.stop(t+.3)}
 if(n==2){o.type="sine";o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(40,t+.3);g.gain.setValueAtTime(1.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.stop(t+.4)}
 o.start(t)}
function tone(ty,f1,f2,d,v,at=0){const t=AC.currentTime+at,o=AC.createOscillator(),g=gn(v);o.type=ty;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d)}
function noise(d,ft,f,v,at=0){const t=AC.currentTime+at,n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const s=AC.createBufferSource(),fl=bq(ft,f),g=gn(v);s.buffer=b;s.connect(fl);fl.connect(g);g.connect(master);s.start(t)}
const SND=[["Bombo",()=>tone("sine",160,40,.4,1.2)],["Caja",()=>{noise(.2,"bandpass",1800,.8);tone("triangle",220,100,.15,.5)}],["Hi-hat",()=>noise(.06,"highpass",7000,.6)],["Palmas",()=>noise(.3,"bandpass",1500,1)],
["Láser",()=>tone("square",2000,80,.3,.3)],["Sirena",()=>{tone("sawtooth",500,1200,.4,.25);tone("sawtooth",1200,500,.4,.25,.4)}],["Bocina",()=>{tone("sawtooth",440,438,.7,.25);tone("sawtooth",554,552,.7,.25)}],["Subidón",()=>tone("sawtooth",200,2000,1.5,.2)],
["Caída",()=>tone("sine",800,30,.8,.7)],["Moneda",()=>{tone("square",988,987,.08,.2);tone("square",1319,1318,.35,.2,.08)}],["Zap",()=>tone("sawtooth",3000,200,.12,.3)],["Tom",()=>tone("sine",220,80,.35,.9)],
["Explosión",()=>noise(1.2,"lowpass",400,1.4)],["Burbuja",()=>tone("sine",300,900,.15,.6)],["Robot",()=>tone("square",110,55,.5,.3)],["Platillo",()=>noise(.9,"highpass",5000,.6)]];
document.body.insertAdjacentHTML("beforeend",`<aside class="dr" id="dr" aria-label="Efectos de sonido"><h2>Efectos de sonido<button id="xFx">Cerrar</button></h2><div class="pg">${SND.map((s,i)=>`<button data-s="${i}">${s[0]}</button>`).join("")}</div></aside>`);
const dr=document.getElementById("dr");
document.getElementById("openFx").onclick=()=>dr.classList.add("open");
document.getElementById("xFx").onclick=()=>dr.classList.remove("open");
all(dr,"[data-s]").forEach(b=>b.onpointerdown=()=>{AC.resume();SND[b.dataset.s][1]()});
const BG=["Barras","Aros","Luces","Apagado"],bgBtn=document.getElementById("bgBtn");
bgBtn.textContent="Fondo: "+BG[bgm];
bgBtn.onclick=()=>{bgm=(bgm+1)%4;bgBtn.textContent="Fondo: "+BG[bgm]};
</script></body></html>
